spring:
  datasource:
    url: jdbc:h2:mem:gymcrm_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

gymcrm:
  hibernate:
    hbm2ddl-auto: update
    show-sql: true
    format-sql: true
