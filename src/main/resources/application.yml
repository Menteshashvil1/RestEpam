spring:
  application:
    name: gym-crm-rest

  # Environment is selected via a Spring profile: local, dev, stg or prod.
  # Each profile carries its own datasource (see application-<profile>.yml).
  # Override with --spring.profiles.active=dev (or SPRING_PROFILES_ACTIVE).
  profiles:
    default: local

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# Actuator: expose health (with details and custom indicators), info, metrics and the
# Prometheus scrape endpoint at /actuator/prometheus.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Gym CRM REST API (EPAM Spring Boot module)

logging:
  level:
    root: INFO
    ge.epam.gymcrm: DEBUG
    TRANSACTION: INFO
    REST: INFO
