spring:
  application:
    name: gym-crm-rest

  profiles:
    default: local

  jackson:
    default-property-inclusion: non_null

  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    packages:
      trust-all: false

server:
  port: 8080
  error:
    include-message: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

gymcrm:
  messaging:
    workload-queue: ${WORKLOAD_QUEUE:trainer.workload.queue}
    send-timeout-ms: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Gym CRM REST API (EPAM Spring Boot module)

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:local-dev-secret-change-me-please-0123456789-abcdef}
    expiration-minutes: 60
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS

logging:
  level:
    root: INFO
    ge.epam.gymcrm: DEBUG
    TRANSACTION: INFO
    REST: INFO
