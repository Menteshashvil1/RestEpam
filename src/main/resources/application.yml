spring:
  application:
    name: gym-crm-rest

  # Environment is selected via a Spring profile: local, dev, stg or prod.
  # Each profile carries its own datasource (see application-<profile>.yml).
  # Override with --spring.profiles.active=dev (or SPRING_PROFILES_ACTIVE).
  profiles:
    default: local

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

# Register with the Eureka discovery service and resolve the workload service by its id.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Route Feign calls through the Resilience4j circuit breaker so a workload-service outage
# is handled by the fallback instead of breaking the main flow.
spring.cloud.openfeign.circuitbreaker.enabled: true

resilience4j:
  circuitbreaker:
    instances:
      trainer-workload-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      trainer-workload-service:
        timeout-duration: 5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# Actuator: expose health (with details and custom indicators), info, metrics and the
# Prometheus scrape endpoint at /actuator/prometheus.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Gym CRM REST API (EPAM Spring Boot module)

# Spring Security / JWT settings. The secret MUST be overridden per environment (e.g. via
# SECURITY_JWT_SECRET); the default below is only for local development and is at least 256 bits.
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:local-dev-secret-change-me-please-0123456789-abcdef}
    expiration-minutes: 60
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS

logging:
  level:
    root: INFO
    ge.epam.gymcrm: DEBUG
    TRANSACTION: INFO
    REST: INFO
