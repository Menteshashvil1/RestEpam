# Tests always run against a fresh in-memory database under a dedicated 'test' profile,
# so the environment profiles (local/dev/stg/prod) never leak into the test run.
spring:
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:gymcrm-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

gymcrm:
  hibernate:
    hbm2ddl-auto: create-drop
    show-sql: false

# Tests must not reach a real Eureka server. The Feign circuit breaker stays enabled so calls
# to the (absent) workload service resolve through the fallback instead of failing the test.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

resilience4j:
  circuitbreaker:
    instances:
      trainer-workload-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
  timelimiter:
    instances:
      trainer-workload-service:
        timeout-duration: 3s

# Security settings for tests (the test application.yml shadows the main one on the classpath).
security:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789-abcdef
    expiration-minutes: 60
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS

# Mirror the actuator exposure of the main configuration so the endpoint tests are meaningful
# (the test application.yml shadows the main one on the classpath).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    root: WARN
    ge.epam.gymcrm: INFO
    TRANSACTION: INFO
    REST: INFO
