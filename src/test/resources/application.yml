spring:
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:gymcrm-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  activemq:
    broker-url: vm://embedded-test?broker.persistent=false&broker.useJmx=false
    user:
    password:

gymcrm:
  hibernate:
    hbm2ddl-auto: create-drop
    show-sql: false

  messaging:
    workload-queue: trainer.workload.queue
    send-timeout-ms: 2000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

security:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789-abcdef
    expiration-minutes: 60
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    root: WARN
    ge.epam.gymcrm: INFO
    TRANSACTION: INFO
    REST: INFO
